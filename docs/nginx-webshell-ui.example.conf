# Anti-Webshell 管理界面 — 仅静态 + API 反代
# 复制到 /etc/nginx/sites-available/ 并按需修改 server_name / listen
#
# 要求：
# - 独立 server 块，不要 include 面板 enable-php-*.conf
# - root 目录 root:root，www/php-fpm 用户不可写
# - WEBSHELL_UI_ROOT 默认 /www/wwwroot/anti-webshell

server {
    listen 80;
    server_name your-monitor.example.com;

    root /www/wwwroot/anti-webshell;
    index index.html;

    location ~* \.(php|phtml|phar|php\d+|cgi|pl|py|jsp|asp|aspx)$ {
        return 403;
    }

    # SPA fallback (required for History mode; Hash mode still fine with this)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}