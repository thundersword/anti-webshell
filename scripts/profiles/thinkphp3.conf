# ThinkPHP 3.1 / 3.2
# www/
#   index.php
#   Application/   (Common/Conf/config.php, Runtime/)
#   Public/
#   ThinkPHP/ThinkPHP.php
DISPLAY_NAME="ThinkPHP 3.x"
PROFILE_NAME="thinkphp3"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "index.php"
    "Public/index.php"
    "Application/Common/Conf/config.php"
    "Application/Common/Conf/db.php"
    "ThinkPHP/ThinkPHP.php"
)

WHITELIST_REL_DIRS=(
    "Application/Runtime"
    "Runtime"
    "Application/Runtime/Cache"
    "Application/Runtime/Temp"
    "Application/Runtime/Logs"
)

# Exclude VCS, Composer, runtime, and bulky framework libraries (critical files above stay watched).
INOTIFY_EXCLUDE='(\.git|\.svn|\.hg|node_modules|/vendor/|/Runtime/|/Application/Runtime/|/ThinkPHP/Library/|/ThinkPHP/Mode/|/ThinkPHP/Tpl/)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
