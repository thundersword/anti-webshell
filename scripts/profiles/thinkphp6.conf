# ThinkPHP 6.x / 8.x (core lives in vendor/topthink/framework)
# app/  config/  public/index.php  runtime/  vendor/  think  .env
DISPLAY_NAME="ThinkPHP 6.x / 8.x"
PROFILE_NAME="thinkphp6"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "public/index.php"
    "public/router.php"
    ".env"
    "think"
    "config/app.php"
    "config/database.php"
    "app/provider.php"
    "app/middleware.php"
)

WHITELIST_REL_DIRS=(
    "runtime/cache"
    "runtime/temp"
    "runtime/log"
    "runtime/session"
)

INOTIFY_EXCLUDE='(\.git|\.svn|\.hg|node_modules|/vendor/|/runtime/)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
