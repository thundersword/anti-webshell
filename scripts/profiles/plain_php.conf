# Plain PHP site profile (minimal defaults; customize per site)
PROFILE_NAME="plain_php"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "index.php"
)

WHITELIST_REL_DIRS=(
    "cache"
    "tmp"
    "temp"
)

INOTIFY_EXCLUDE='(\.git|\.svn|cache|tmp|temp)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
