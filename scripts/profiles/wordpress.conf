# WordPress site profile (relative paths from PROJECT_DIR)
PROFILE_NAME="wordpress"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "index.php"
    "wp-config.php"
    "wp-login.php"
    "wp-settings.php"
    "wp-load.php"
)

WHITELIST_REL_DIRS=(
    "wp-content/cache"
    "wp-content/uploads"
    "wp-content/upgrade"
)

INOTIFY_EXCLUDE='(wp-content/cache|wp-content/upgrade|\.git|\.svn)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
