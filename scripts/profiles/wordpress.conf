# WordPress site profile (relative paths from PROJECT_DIR)
# Do not exclude or whitelist wp-content/uploads: that is a common webshell drop path.
DISPLAY_NAME="WordPress"
PROFILE_NAME="wordpress"
PROFILE_VERSION="2"

CRITICAL_REL_PATHS=(
    "index.php"
    "wp-config.php"
    "wp-login.php"
    "wp-settings.php"
    "wp-load.php"
)

WHITELIST_REL_DIRS=(
    "wp-content/cache"
    "wp-content/upgrade"
)

INOTIFY_EXCLUDE='(\.git|\.svn|\.hg|node_modules|/vendor/|/wp-content/cache/|/wp-content/upgrade/)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
