# Laravel site profile (relative paths from PROJECT_DIR)
PROFILE_NAME="laravel"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "public/index.php"
    "artisan"
    ".env"
    "bootstrap/app.php"
    "config/app.php"
    "config/database.php"
)

WHITELIST_REL_DIRS=(
    "storage/framework/cache"
    "storage/framework/sessions"
    "storage/framework/views"
    "storage/logs"
    "bootstrap/cache"
)

INOTIFY_EXCLUDE='(storage/framework|storage/logs|bootstrap/cache|\.git|\.svn|vendor/.*)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
