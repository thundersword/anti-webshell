# Laravel site profile (relative paths from PROJECT_DIR)
DISPLAY_NAME="Laravel"
PROFILE_NAME="laravel"
PROFILE_VERSION="2"

CRITICAL_REL_PATHS=(
    "public/index.php"
    "artisan"
    ".env"
    "bootstrap/app.php"
    "config/app.php"
    "config/database.php"
)

WHITELIST_REL_DIRS=(
    "storage/framework/cache"
    "storage/framework/sessions"
    "storage/framework/views"
    "storage/logs"
    "bootstrap/cache"
)

INOTIFY_EXCLUDE='(\.git|\.svn|\.hg|node_modules|/vendor/|/storage/framework/|/storage/logs/|/bootstrap/cache/)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
