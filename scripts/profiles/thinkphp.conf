# ThinkPHP site profile (relative paths from PROJECT_DIR)
PROFILE_NAME="thinkphp"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "public/index.php"
    "public/admin.php"
    "application/config.php"
    "application/database.php"
    "thinkphp/base.php"
)

WHITELIST_REL_DIRS=(
    "runtime/cache"
    "runtime/temp"
)

# inotifywait --exclude regex (relative to tree under PROJECT_DIR)
INOTIFY_EXCLUDE='(runtime/log|runtime/cache/.*\.php|runtime/temp/.*\.php|\.git|\.svn)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
