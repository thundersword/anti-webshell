# ThinkPHP 5.0 / 5.1
# 5.0: application/config.php, application/database.php, thinkphp/base.php
# 5.1: config/app.php, config/database.php, application/ (code only)
DISPLAY_NAME="ThinkPHP 5.x"
PROFILE_NAME="thinkphp5"
PROFILE_VERSION="1"

CRITICAL_REL_PATHS=(
    "public/index.php"
    "public/admin.php"
    "application/config.php"
    "application/database.php"
    "config/app.php"
    "config/database.php"
    "thinkphp/base.php"
    "thinkphp/start.php"
)

WHITELIST_REL_DIRS=(
    "runtime/cache"
    "runtime/temp"
    "runtime/log"
    "runtime/session"
)

INOTIFY_EXCLUDE='(\.git|\.svn|\.hg|node_modules|/vendor/|/runtime/|/thinkphp/library/|/thinkphp/tpl/|/thinkphp/lang/)'

DANGEROUS_EXTENSIONS="php|php3|php4|php5|phtml|pht|phps|sh|py|pl|cgi|asp|aspx|jsp|html|htm|shtml"
